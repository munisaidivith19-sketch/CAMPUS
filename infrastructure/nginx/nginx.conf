# =============================================================================
# CampusConnect — reverse proxy (production-like) reference config.
# Terminates TLS, sets security headers, applies coarse rate limiting, and
# forwards to the API + web app. Used in later phases; documented now so the
# architecture's "reverse proxy" layer is concrete.
# =============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;                       # don't leak nginx version

  # Coarse rate limiting (finer per-user limits live in the app).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream api_upstream  { server backend:4000; }
  upstream web_upstream  { server web:5173; }

  server {
    listen 80;
    server_name _;
    # In production, redirect all HTTP to HTTPS and serve TLS on 443.
    # return 301 https://$host$request_uri;

    # Security headers (belt-and-suspenders with Helmet at the app layer).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # HSTS only over HTTPS:
    # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    client_max_body_size 30m;              # aligns with MAX_UPLOAD_BYTES headroom

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://api_upstream;
    }

    location /socket.io/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_pass http://api_upstream;
    }

    location / {
      proxy_set_header Host $host;
      proxy_pass http://web_upstream;
    }
  }
}
